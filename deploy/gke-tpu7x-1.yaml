# Single-chip TPU7x pod (1 chip = 2 TensorCores) running the public vLLM-TorchTPU image used for every
# published number. Needs a node pool whose nodes expose one TPU7x chip (topology 1x1x1).
#   kubectl apply -f deploy/gke-tpu7x-1.yaml
#   kubectl exec -it minicpm5-tpu7x-1 -- bash    # then follow README "Step 3 — Install the plugin"
#   kubectl delete pod minicpm5-tpu7x-1           # when done
apiVersion: v1
kind: Pod
metadata:
  name: minicpm5-tpu7x-1
spec:
  restartPolicy: Never
  nodeSelector:
    cloud.google.com/gke-tpu-accelerator: tpu7x
    cloud.google.com/gke-tpu-topology: 1x1x1
  tolerations:
  - key: google.com/tpu
    operator: Equal
    value: present
    effect: NoSchedule
  containers:
  - name: runner
    image: vllm/vllm-torchtpu:nightly-20261027-e91801a-v0.32.0
    command: ["bash", "-lc", "sleep infinity"]
    env:
    - name: HF_HOME
      value: /dev/shm/hf_cache
    resources:
      limits:
        google.com/tpu: 1
    volumeMounts:
    - name: dshm
      mountPath: /dev/shm
  volumes:
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 80Gi
